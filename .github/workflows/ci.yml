name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      # 이 패키지는 유료·비공개 cms-orbit/saas 를 요구하므로 공개 러너에서
      # `composer update` 가 성립하지 않는다 (Packagist 에 없다 — 의도된
      # 배포 전략이다). 그래서 의존성을 설치하지 않고, 포매터만 별도
      # 프로젝트에 받아 저장소의 pint.json 기준으로 검사한다.
      - name: Install Pint standalone
        run: |
          mkdir -p /tmp/pint-tool
          composer require --dev laravel/pint --no-interaction --no-progress --working-dir=/tmp/pint-tool

      - name: Check formatting
        run: /tmp/pint-tool/vendor/bin/pint --test
